<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aeye KV Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="neo-app">
      <nav class="lovart-rail" aria-label="主导航">
        <button type="button" class="rail-item lovart-create" id="newProjectButton" data-view-target="generate" title="新建项目">+</button>
        <div class="lovart-rail-pills">
          <button type="button" class="rail-item active" data-view-target="home" id="homeButton" title="生成"><img src="/ui-assets/icon/nav-generate.png" alt="" /><span>生成</span></button>
          <button type="button" class="rail-item" data-view-target="assets" id="assetsButton" title="项目"><img src="/ui-assets/icon/nav-projects.png" alt="" /><span>项目</span></button>
          <button type="button" class="rail-item" data-view-target="styles" id="styleButton" title="风格"><img src="/ui-assets/icon/nav-style.png" alt="" /><span>风格</span></button>
          <button type="button" class="rail-item" data-view-target="materials" id="libraryButton" title="灵感"><img src="/ui-assets/icon/nav-inspiration.png" alt="" /><span>灵感</span></button>
        </div>
      </nav>

      <main class="lovart-main">
        <header class="lovart-topbar">
          <div class="lovart-brand">
            <img src="/ui-assets/logo.png" alt="灵眸设计探索" class="brand-logo" />
          </div>
          <input
            id="adminTokenInput"
            class="admin-token-input"
            type="password"
            placeholder="管理令牌"
            autocomplete="off"
            title="管理令牌（ADMIN_TOKEN），用于生成、上传与删除等写接口"
          />
        </header>

        <section id="homePage" class="neo-page home-page active">
          <div class="home-wrap">
            <div class="home-title">今天想创作什么？</div>
            <div class="home-prompt-card">
              <div class="prompt-sentence">
                <span>主标题为</span>
                <input id="homeCampaignNameInput" class="sentence-chip" placeholder="活动名称（选填）" autocomplete="off" />
                <span>，副标题为</span>
                <input id="homeCampaignSubtitleInput" class="sentence-chip" placeholder="活动副标题（选填）" autocomplete="off" />
                <span>，活动时间为</span>
                <input id="homeCampaignTimeInput" class="sentence-chip" placeholder="活动时间（选填）" autocomplete="off" />
              </div>
              <textarea
                id="homePromptInput"
                class="home-prompt-input"
                rows="2"
                placeholder="上传参考图、输入文字或 @主体，描述你想生成的图片。"
                autocomplete="off"
              ></textarea>
              <div class="prompt-tools">
                <div class="prompt-tool-chips">
                  <button type="button" class="prompt-tool-chip" data-action="upload" title="上传图片">上传图片</button>
                  <button type="button" class="prompt-tool-chip" data-action="style" title="风格预设">风格预设</button>
                  <button type="button" class="prompt-tool-chip" data-action="size" title="尺寸"><span>3:4</span></button>
                  <button type="button" class="prompt-tool-chip" data-action="expand" title="扩写">扩写</button>
                </div>
                <button type="button" class="notification-bell" title="通知">✦</button>
                <button id="homeGenerateButton" type="button" class="home-generate-btn" title="生成">➤</button>
              </div>
            </div>
            <div class="home-section">
              <div class="home-section-head">
                <h2>最近项目</h2>
                <button id="recentProjectsMore" type="button" class="text-link">查看全部 <span class="arrow">→</span></button>
              </div>
              <div id="recentProjects" class="project-grid empty-state">加载中...</div>
            </div>
            <div class="home-section">
              <div class="home-section-head">
                <h2>灵感发现</h2>
                <button id="homeInspirationMore" type="button" class="text-link">查看全部 <span class="arrow">→</span></button>
              </div>
              <div class="inspiration-filters">
                <button type="button" class="inspiration-filter active" data-home-filter="全部">全部</button>
                <button type="button" class="inspiration-filter" data-home-filter="字体">字体</button>
                <button type="button" class="inspiration-filter" data-home-filter="构图">构图</button>
                <button type="button" class="inspiration-filter" data-home-filter="风格">风格</button>
                <button type="button" class="inspiration-filter" data-home-filter="元素">元素</button>
              </div>
              <div id="homeInspiration" class="material-masonry empty-state">加载中...</div>
            </div>
          </div>
        </section>

        <section id="generatePage" class="neo-page generate-page">
          <div id="errorBox" class="toast hidden"></div>

          <div class="canvas-layout">
            <div class="canvas-main">
              <div id="canvasToolbar" class="canvas-toolbar hidden">
                <span id="canvasProjectTitle" class="canvas-project-title"></span>
                <div class="canvas-zoom">
                  <button id="canvasZoomOut" type="button">−</button>
                  <span id="canvasZoomLevel">100%</span>
                  <button id="canvasZoomIn" type="button">+</button>
                </div>
                <button id="canvasFitButton" type="button" class="canvas-tool-btn">适应</button>
              </div>
              <div id="canvasWorkspace" class="canvas-workspace">
                <div id="canvasViewport" class="canvas-viewport"></div>
                <div id="canvasEmpty" class="canvas-empty">生成结果会展示在这里，可拖动画布、滚轮缩放</div>
                <div id="nodeToolbar" class="node-toolbar hidden">
                  <button type="button" data-node-tool="open">HD 放大</button>
                  <button type="button" data-node-tool="split">拆分图层</button>
                  <button type="button" data-node-tool="download">下载</button>
                  <span class="node-toolbar-divider"></span>
                  <button type="button" data-node-tool="deselect" class="node-toolbar-close" title="取消选中">×</button>
                </div>
                <div class="canvas-bottom-toolbar">
                  <button type="button" class="ctb-primary" data-action="run" title="生成">➤</button>
                  <button type="button" id="uploadTrigger" title="上传图片">＋</button>
                  <button type="button" id="stylePickerButton" title="风格预设">🎨<span id="stylePickerLabel" class="ctb-label">风格预设</span></button>
                  <button type="button" id="sizePickerButton" title="尺寸"><span id="sizeIcon" class="size-icon ratio-34"></span><span id="sizeText">3:4</span></button>
                  <button type="button" id="expandDescriptionButton" title="扩写">✦<span class="ctb-label">扩写</span></button>
                  <span class="ctb-divider"></span>
                  <button type="button" id="doudouIpButton" class="doudou-toggle" aria-pressed="false" title="兜兜IP">🐰</button>
                  <button type="button" id="includeLogoButton" class="overlay-toggle" aria-pressed="false" title="左上角 Logo">L</button>
                  <button type="button" id="includeSearchOverlayButton" class="overlay-toggle" aria-pressed="false" title="右下角搜索框">⌕</button>
                  <span class="ctb-dot"></span>
                </div>
              </div>

              <section id="generationStory" class="generation-story hidden">
                <h1 id="storyTitle"></h1>
                <div id="storyReferences" class="story-references"></div>
                <p id="storyDescription" class="story-description"></p>
                <div id="stageAccordions" class="stage-accordions"></div>
                <div id="resultView" class="generated-result empty-state">等待生成结果</div>
              </section>
            </div>

            <aside id="chatPanel" class="chat-panel">
              <div class="chat-head">
                <span id="chatProjectPrompt" class="chat-project-prompt"></span>
                <div class="chat-head-actions">
                  <button type="button" title="项目信息">i</button>
                  <button type="button" title="更多">⋯</button>
                  <button type="button" title="关闭" data-action="close-chat">×</button>
                </div>
              </div>
              <div id="chatMessages" class="chat-messages">
                <div class="chat-empty">输入想法可基于当前画布继续生成新变体；选中画布中的图后，可针对该图直接修改。</div>
              </div>
              <button id="chatScrollBottom" type="button" class="chat-scroll-bottom hidden" title="回到底部">↓</button>
              <div class="chat-composer">
                <div id="referenceStrip" class="reference-strip hidden"></div>
                <div class="composer-row">
                  <button type="button" class="composer-avatar" data-action="upload" title="上传参考图">＋</button>
                  <div class="composer-input-wrap">
                    <textarea id="chatInput" rows="2" placeholder="今天我们要创作什么" autocomplete="off"></textarea>
                    <div id="mentionMenu" class="mention-menu hidden"></div>
                  </div>
                </div>
                <div class="composer-tools">
                  <button type="button" data-action="upload" title="上传图片">上传图片</button>
                  <button type="button" data-action="style" title="风格预设">风格预设</button>
                  <button type="button" data-action="size" title="尺寸"><span>3:4</span></button>
                  <button type="button" data-action="expand" title="扩写">扩写</button>
                  <span class="composer-spacer"></span>
                  <button id="chatSendButton" type="button" class="composer-send" title="发送">↑</button>
                </div>
              </div>
            </aside>
          </div>
        </section>

        <section id="assetsPage" class="neo-page assets-page">
          <div class="page-content">
            <div class="projects-head">
              <h1>项目</h1>
              <button id="newProjectFromProjectsButton" type="button" class="primary-btn">新建项目</button>
            </div>
            <div id="projectsGrid" class="project-grid empty-state">正在读取项目...</div>
          </div>
        </section>

        <section id="stylesPage" class="neo-page styles-page">
          <div class="page-content">
            <h1>风格预设管理</h1>
            <div id="styleMessage" class="inline-message"></div>
            <div id="styleList" class="style-card-grid empty-state">正在读取风格...</div>
            <input id="styleFolderInput" type="file" webkitdirectory directory multiple hidden />
            <form id="styleForm" class="hidden"></form>
          </div>
        </section>

        <section id="materialsPage" class="neo-page materials-page">
          <div class="page-content">
            <h1>灵感</h1>
            <div class="tabs" id="libraryTabs">
              <div class="material-tab-list" role="tablist" aria-label="按参考用途筛选">
                <button type="button" class="tab-button active" data-material-tab="全部">全部</button>
                <button type="button" class="tab-button" data-material-tab="完整案例">完整案例</button>
                <button type="button" class="tab-button" data-material-tab="字体标题">字体标题</button>
                <button type="button" class="tab-button" data-material-tab="构图版式">构图版式</button>
                <button type="button" class="tab-button" data-material-tab="风格质感">风格质感</button>
                <button type="button" class="tab-button" data-material-tab="元素主体">元素主体</button>
                <button type="button" class="tab-button" data-material-tab="色彩氛围">色彩氛围</button>
                <button type="button" class="tab-button" data-material-tab="场景空间">场景空间</button>
              </div>
              <form id="inspirationSearchForm" class="inspiration-search" role="search">
                <label class="visually-hidden" for="inspirationSearchInput">搜索 Pinterest 与 Behance 设计灵感</label>
                <input id="inspirationSearchInput" type="search" maxlength="80" autocomplete="off" placeholder="搜索设计灵感，如：美妆、宠物、夏日" />
                <button id="inspirationSearchButton" type="submit">搜索</button>
              </form>
            </div>
            <div id="materialFilters" class="material-filter-bar">
              <label>
                <span>设计类型</span>
                <select id="materialDesignTypeFilter"><option value="全部">全部</option></select>
              </label>
              <label>
                <span>来源</span>
                <select id="materialSourceFilter">
                  <option value="全部">全部</option>
                  <option value="pinterest">Pinterest</option>
                  <option value="behance">Behance</option>
                  <option value="preset-library">风格预设</option>
                  <option value="local">本地素材</option>
                  <option value="upload">手动上传</option>
                </select>
              </label>
              <label>
                <span>画幅</span>
                <select id="materialOrientationFilter">
                  <option value="全部">全部</option>
                  <option value="竖版">竖版</option>
                  <option value="横版">横版</option>
                  <option value="方形">方形</option>
                </select>
              </label>
              <button id="materialFilterReset" type="button" class="material-filter-reset">重置筛选</button>
            </div>
            <div id="libraryMessage" class="inline-message"></div>
            <section id="inspirationSection" class="inspiration-section hidden" aria-live="polite">
              <div class="inspiration-head">
                <div>
                  <h2 id="inspirationTitle">设计灵感</h2>
                  <p id="inspirationSummary"></p>
                </div>
                <button id="inspirationClearButton" type="button" class="inspiration-clear">返回素材库</button>
              </div>
              <div id="inspirationStatus" class="inspiration-status"></div>
              <div id="inspirationList" class="inspiration-masonry"></div>
            </section>
            <div id="libraryList" class="material-masonry empty-state">正在读取素材库...</div>
          </div>
        </section>
      </main>
    </div>

    <div id="materialDetailModal" class="detail-modal hidden">
      <button type="button" class="modal-scrim" data-close-material-detail aria-label="关闭"></button>
      <section class="detail-card" role="dialog" aria-modal="true" aria-label="素材详情">
        <div class="detail-media"><img id="materialDetailImage" alt="" /></div>
        <div class="detail-info">
          <div class="detail-head">
            <strong id="materialDetailType">字体</strong>
            <button type="button" class="close-round" data-close-material-detail>×</button>
          </div>
          <p id="materialDetailCategory"></p>
          <p id="materialDetailDescription"></p>
          <a id="materialDetailSource" class="material-source-link hidden" href="#" target="_blank" rel="noopener noreferrer">查看原来源</a>
          <div class="material-detail-actions">
            <button type="button" id="materialSameButton" class="material-action-button secondary">做同款</button>
            <button type="button" id="materialUseReferenceButton" class="material-action-button primary">用作参考图</button>
          </div>
          <button type="button" id="materialDeleteButton" class="danger-pill material-delete-button">删除</button>
        </div>
      </section>
    </div>

    <div id="inspirationPreviewModal" class="detail-modal hidden">
      <button type="button" class="modal-scrim" data-close-inspiration-preview aria-label="关闭"></button>
      <section class="detail-card inspiration-preview-card" role="dialog" aria-modal="true" aria-label="设计灵感详情">
        <div class="detail-media inspiration-preview-media">
          <img id="inspirationPreviewImage" alt="" />
          <div id="inspirationPreviewFallback" class="inspiration-image-fallback hidden">图片暂时无法加载</div>
        </div>
        <div class="detail-info inspiration-preview-info">
          <div class="detail-head">
            <strong id="inspirationPreviewType">视觉设计</strong>
            <button type="button" class="close-round" data-close-inspiration-preview>×</button>
          </div>
          <h2 id="inspirationPreviewTitle"></h2>
          <p id="inspirationPreviewDescription"></p>
          <dl class="inspiration-meta-list">
            <div><dt>来源</dt><dd id="inspirationPreviewSource">Pinterest</dd></div>
            <div id="inspirationPreviewAuthorRow" class="hidden"><dt>作者</dt><dd id="inspirationPreviewAuthor"></dd></div>
            <div><dt>匹配查询</dt><dd id="inspirationPreviewQuery"></dd></div>
            <div><dt>图片尺寸</dt><dd id="inspirationPreviewDimensions"></dd></div>
          </dl>
          <fieldset class="reference-role-picker">
            <legend>保存为参考素材</legend>
            <p>一张图可以承担多个参考用途</p>
            <div class="reference-role-options">
              <label><input type="checkbox" value="完整案例" checked /><span>完整案例</span></label>
              <label><input type="checkbox" value="字体标题" /><span>字体标题</span></label>
              <label><input type="checkbox" value="构图版式" /><span>构图版式</span></label>
              <label><input type="checkbox" value="风格质感" /><span>风格质感</span></label>
              <label><input type="checkbox" value="元素主体" /><span>元素主体</span></label>
              <label><input type="checkbox" value="色彩氛围" /><span>色彩氛围</span></label>
              <label><input type="checkbox" value="场景空间" /><span>场景空间</span></label>
            </div>
          </fieldset>
          <label class="inspiration-tag-field" for="inspirationSaveTags">
            <span>主题标签</span>
            <input id="inspirationSaveTags" type="text" maxlength="160" placeholder="用逗号分隔，如：宠物、活动KV" />
          </label>
          <p id="inspirationSaveMessage" class="inspiration-save-message"></p>
          <div class="inspiration-preview-actions">
            <a id="inspirationPreviewLink" class="material-action-button secondary inspiration-original-link" href="#" target="_blank" rel="noopener noreferrer">查看原项目</a>
            <button id="inspirationSaveButton" type="button" class="material-action-button primary">保存到素材库</button>
          </div>
        </div>
      </section>
    </div>

    <form id="materialForm" class="hidden"></form>
    <form id="xlsxForm" class="hidden"></form>
    <form id="briefForm" class="hidden" enctype="multipart/form-data" novalidate>
      <input id="campaignNameInput" type="hidden" name="campaign_name" value="" />
      <input id="campaignSubtitleInput" type="hidden" name="campaign_subtitle" value="" />
      <input id="campaignTimeInput" type="hidden" name="campaign_time" value="" />
      <input id="stylePresetInput" type="hidden" name="style_preset" value="none" />
      <input id="integratedLayoutInput" type="hidden" name="integrated_layout_variant" value="" />
      <input id="imageSizeInput" type="hidden" name="image_size" value="3:4" />
      <input id="doudouIpInput" type="hidden" name="doudou_ip" value="false" />
      <input name="generate_image" type="checkbox" checked hidden />
      <input id="referenceImageInput" name="reference_image" type="file" accept="image/*" multiple hidden />
      <textarea id="visualDescriptionInput" name="visual_description"></textarea>
      <button type="submit" id="runButton" class="hidden">运行</button>
    </form>
    <div id="sizePopover" class="floating-picker size-picker hidden"></div>
    <div id="stylePresetSection" class="style-picker hidden"></div>
    <script src="/app.js"></script>
  </body>
</html>
